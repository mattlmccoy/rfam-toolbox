name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names (ignore F824 — false positive on global declarations)
          flake8 rfam_toolbox --count --select=E9,F63,F7,F821 --show-source --statistics
          # Warn on everything else (non-blocking)
          flake8 rfam_toolbox --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Smoke test — import and version
        run: |
          python -c "import rfam_toolbox; print(rfam_toolbox.__version__)"
          python -m rfam_toolbox --version
